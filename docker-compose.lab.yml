# CipherScope MVP lab stack: strongSwan gateways, clients, servers, and the capture tap.
# Topology and addressing come from lab/network/bridges.yaml (mvp.md §3.1):
#   Tunnel: client-a(10.1.0.10/fd01::10) -- gw-a(172.30.0.2/fd30::2) === IPsec === gw-b(172.30.0.3/fd30::3) -- server-b(10.2.0.10/fd02::10)
#   Transport: host-a(172.30.0.2/fd30::2) === IPsec === host-b(172.30.0.3/fd30::3)

x-common: &lab-common
  restart: "no"

networks:
  lab-bridge:
    name: lab-bridge
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd30::/64

services:
  lab-bridge-tap:
    # Idle container that holds the bridge attached for the capture sidecar
    # (docker-compose.yml references network_mode: "container:lab-bridge-tap").
    container_name: lab-bridge-tap
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      lab-bridge:
        ipv4_address: 172.30.0.20
        ipv6_address: fd30::20

  gw-a:
    build: ./lab/images/gateway
    <<: *lab-common
    container_name: gw-a
    environment:
      LAB_ROLE: gw-a
      LAB_PROFILE: ${LAB_PROFILE:-p01}
    volumes:
      - ./lab/profiles:/profiles:ro
      - ./lab/templates:/templates:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      # Same-L2 forwarding would emit ICMP redirects teaching client-a to
      # bypass the gateway (and the XFRM policy) entirely — kill them.
      - net.ipv4.conf.all.send_redirects=0
      - net.ipv4.conf.default.send_redirects=0
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      lab-bridge:
        ipv4_address: 172.30.0.2
        ipv6_address: fd30::2

  gw-b:
    build: ./lab/images/gateway
    <<: *lab-common
    container_name: gw-b
    environment:
      LAB_ROLE: gw-b
      LAB_PROFILE: ${LAB_PROFILE:-p01}
    volumes:
      - ./lab/profiles:/profiles:ro
      - ./lab/templates:/templates:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.send_redirects=0
      - net.ipv4.conf.default.send_redirects=0
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      lab-bridge:
        ipv4_address: 172.30.0.3
        ipv6_address: fd30::3

  client-a:
    build: ./lab/images/client
    <<: *lab-common
    container_name: client-a
    cap_add: [NET_ADMIN, NET_RAW]   # entrypoint assigns the 10.1.0.10 inner IP
    sysctls:                        # never learn bypass routes via redirects
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.default.accept_redirects=0
      - net.ipv4.conf.all.send_redirects=0
    volumes:
      - ./lab/traffic:/traffic:ro   # generators dispatched by orchestrate.py
    networks:
      lab-bridge:
        ipv4_address: 172.30.0.10
        ipv6_address: fd30::10

  server-b:
    build:
      context: ./lab
      dockerfile: images/server/Dockerfile
    <<: *lab-common
    container_name: server-b
    cap_add: [NET_ADMIN, NET_RAW]   # entrypoint assigns the 10.2.0.10 inner IP
    sysctls:
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.default.accept_redirects=0
      - net.ipv4.conf.all.send_redirects=0
    volumes:
      - ./lab/traffic:/traffic:ro   # voip/uac.xml and the messaging bot
    networks:
      lab-bridge:
        ipv4_address: 172.30.0.11
        ipv6_address: fd30::11

  # Transport mode endpoints share the gateways' network namespaces, so their
  # packets match the host-to-host XFRM selectors (172.30/fd30).
  transport-client:
    profiles: [transport]
    build: ./lab/images/client
    container_name: transport-client
    network_mode: "container:gw-a"
    depends_on: [gw-a]
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./lab/traffic:/traffic:ro

  transport-server:
    profiles: [transport]
    build:
      context: ./lab
      dockerfile: images/server/Dockerfile
    container_name: transport-server
    network_mode: "container:gw-b"
    depends_on: [gw-b]
    environment:
      TRANSPORT_HOST: "1"
    volumes:
      - ./lab/traffic:/traffic:ro
