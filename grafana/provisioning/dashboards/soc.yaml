apiVersion: 1

providers:
  - name: cipherscope-soc
    folder: CipherScope
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Dashboards are mounted from ./grafana/dashboards (docker-compose.yml).
      path: /var/lib/grafana/dashboards
